<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vasu, animator. Explainer videos, product launches and brand motion.">
<title>Vasu · Animation Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: studio landing page. Centered hero over a full-width live reel, then video-first case cards, pricing, proof, FAQ, closing CTA. */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --ink: #0d0f14;
  --muted: #62666f;
  --line: #e4e4de;
  --accent: #3a46ff;     /* cobalt */
  --accent-ink: #ffffff;
  --sun: #ffcf3a;        /* highlighter */
  --coral: #ff5a47;
  --tile-a: #e9ebff; --tile-b: #fff3cc; --tile-c: #ffe3df; --tile-d: #e2f4ec;
  --f-display: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --r-lg: 28px; --r-md: 18px;
  --step--1: .84rem; --step-0: 1rem; --step-1: 1.2rem; --step-2: 1.6rem; --step-3: clamp(2rem, 4.6vw, 3.4rem); --step-4: clamp(2.6rem, 7.4vw, 6rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c10; --surface: #15171d; --ink: #f2f2ee; --muted: #9a9ea8; --line: #262932;
    --accent: #7c84ff; --accent-ink: #0b0c10; --sun: #ffd65c; --coral: #ff7a69;
    --tile-a: #1c1f3a; --tile-b: #2e2814; --tile-c: #34191a; --tile-d: #142a22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c10; --surface: #15171d; --ink: #f2f2ee; --muted: #9a9ea8; --line: #262932;
  --accent: #7c84ff; --accent-ink: #0b0c10; --sun: #ffd65c; --coral: #ff7a69;
  --tile-a: #1c1f3a; --tile-b: #2e2814; --tile-c: #34191a; --tile-d: #142a22; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-display); font-size: var(--step-0); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.035em; line-height: 1; }
.serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: .02em; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); padding: 6px 12px 6px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px #22c55e33; }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 12px; }
.navbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 999px; padding: 8px 8px 8px 20px; }
.brand { font-weight: 800; letter-spacing: -.03em; text-decoration: none; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; }
.brand b { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-block; animation: squash 1.2s cubic-bezier(.5,0,.5,1) infinite; transform-origin: bottom; }
.navlinks { display: flex; gap: 22px; }
.navlinks a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: .95rem; }
.navlinks a:hover { color: var(--ink); }
.navright { display: flex; align-items: center; gap: 8px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.btn { display: inline-flex; align-items: center; gap: 10px; font: 600 .98rem var(--f-display); text-decoration: none; border-radius: 999px; padding: 12px 20px; border: 0; cursor: pointer; transition: transform .2s cubic-bezier(.3,1.5,.6,1), box-shadow .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.accent { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 30px -10px var(--accent); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn .arrow { transition: transform .2s; }
.btn:hover .arrow { transform: translateX(3px); }

/* hero */
.hero { text-align: center; padding-block: clamp(48px, 8vw, 104px) 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.hero h1 { font-size: var(--step-4); font-weight: 800; max-width: 15ch; }
.hero h1 .serif { font-weight: 400; }
.hl { position: relative; white-space: nowrap; }
.hl::before { content: ""; position: absolute; left: -4px; right: -4px; bottom: .08em; height: .32em; background: var(--sun); z-index: -1; border-radius: 4px; transform-origin: left; animation: mark .8s .5s cubic-bezier(.6,0,.2,1) both; }
.hero p { font-size: var(--step-1); color: var(--muted); max-width: 46ch; margin: 0; }
.hero .ctas { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.trust { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .92rem; flex-wrap: wrap; justify-content: center; }
.faces { display: flex; }
.faces span { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -8px; }
.faces span:first-child { margin-left: 0; }
.rise > * { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
.rise > *:nth-child(2) { animation-delay: .06s } .rise > *:nth-child(3) { animation-delay: .12s } .rise > *:nth-child(4) { animation-delay: .18s } .rise > *:nth-child(5) { animation-delay: .24s }

.reel { position: relative; margin-top: 8px; margin-bottom: clamp(48px, 7vw, 96px); border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16/8; max-width: 100%; background: #0d0f14; box-shadow: 0 40px 80px -40px color-mix(in srgb, var(--accent) 70%, transparent); }
.reel canvas { width: 100%; height: 100%; display: block; }
.reel .bar { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 14px; color: #fff; }
.reel .play { width: 54px; height: 54px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; flex: none; text-decoration: none; transition: transform .2s; }
.reel .play:hover { transform: scale(1.08); }
.reel .play::after { content: ""; border-left: 16px solid #0d0f14; border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
.reel .track { flex: 1; height: 4px; border-radius: 4px; background: #ffffff33; overflow: hidden; }
.reel .track i { display: block; height: 100%; width: 0; background: #ffffff; }
.reel .tc { font-family: var(--f-mono); font-size: .8rem; font-variant-numeric: tabular-nums; opacity: .85; }

/* logos marquee */
.logos { padding-block: 40px 16px; text-align: center; }
.logos p { color: var(--muted); font-size: .92rem; margin: 0 0 18px; }
.marquee { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.marquee .row { display: flex; gap: 14px; width: max-content; animation: slide 30s linear infinite; }
.logo-slot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.logo-slot i { width: 18px; height: 18px; border-radius: 5px; background: var(--line); display: inline-block; }

/* sections */
section.block { padding-block: clamp(64px, 9vw, 120px); }
.sechead { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; margin-bottom: clamp(32px, 5vw, 56px); }
.sechead h2 { font-size: var(--step-3); font-weight: 800; max-width: 18ch; }
.sechead p { color: var(--muted); max-width: 52ch; margin: 0; font-size: var(--step-1); }

/* work cards */
.filters { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip { font: 500 .92rem var(--f-display); padding: 8px 14px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 14px; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
.case:hover { transform: translateY(-6px); box-shadow: 0 30px 60px -30px #0d0f1440; }
.case .media { position: relative; aspect-ratio: 16/10; max-width: 100%; border-radius: calc(var(--r-lg) - 8px); overflow: hidden; }
.case canvas { width: 100%; height: 100%; display: block; }
.badge { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 6px; background: #ffffffee; color: #0d0f14; font-weight: 700; font-size: .86rem; padding: 6px 12px; border-radius: 999px; box-shadow: 0 6px 16px -8px #0006; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
.case .info { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 10px 10px; }
.case h3 { font-size: var(--step-2); font-weight: 750; }
.case .sub { color: var(--muted); font-size: .92rem; }
.case .go { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; text-decoration: none; flex: none; transition: background .2s, color .2s; }
.case:hover .go { background: var(--ink); color: var(--bg); }
.case[hidden] { display: none !important; }

/* statement */
.statement { text-align: center; }
.statement h2 { font-size: var(--step-4); font-weight: 800; max-width: 16ch; margin: 0 auto; }
.statement h2 .muted { color: var(--muted); }
.statement p { color: var(--muted); max-width: 54ch; margin: 24px auto 0; font-size: var(--step-1); }

/* pricing */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.plan.pop { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plan.pop .pmuted { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.plan .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.plan h3 { font-size: var(--step-1); font-weight: 700; letter-spacing: -.02em; }
.pill { font-family: var(--f-mono); font-size: .74rem; padding: 4px 10px; border-radius: 999px; background: var(--sun); color: #0d0f14; white-space: nowrap; }
.price { font-size: clamp(2.4rem, 4vw, 3.2rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.price small { font-size: 1rem; font-weight: 500; letter-spacing: 0; }
.pmuted { color: var(--muted); margin: 0; font-size: .95rem; }
.plan ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.plan li { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; }
.plan li::before { content: "✓"; flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); margin-top: 2px; }
.plan.pop li::before { background: var(--accent); color: var(--accent-ink); }
.plan .btn { justify-content: center; }
.plan.pop .btn.accent { box-shadow: none; }

/* about */
.about { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(24px, 4vw, 48px); align-items: center; }
.portrait { aspect-ratio: 4/5; max-width: 100%; border-radius: var(--r-lg); background: var(--tile-a); position: relative; overflow: hidden; display: grid; place-items: center; }
.portrait canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.portrait span { position: relative; font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); background: var(--surface); padding: 6px 12px; border-radius: 999px; border: 1px dashed var(--line); }
.about h2 { font-size: var(--step-3); font-weight: 800; margin-bottom: 18px; }
.about p { color: var(--muted); max-width: 58ch; margin: 0 0 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 26px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; }
.stat b { display: block; font-size: var(--step-2); font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .86rem; }
.timeline { display: grid; gap: 0; border-top: 1px solid var(--line); }
.timeline div { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.timeline .mono { color: var(--muted); padding-top: 2px; }

/* testimonials (placeholders) */
.quotes { columns: 3 280px; column-gap: 16px; }
.quote { break-inside: avoid; margin: 0 0 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-md); padding: 22px; }
.quote blockquote { margin: 0 0 18px; font-size: 1.05rem; color: var(--muted); }
.quote figcaption { display: flex; gap: 12px; align-items: center; }
.quote .av { width: 40px; height: 40px; border-radius: 50%; background: var(--line); flex: none; }
.quote b { display: block; font-size: .95rem; }
.quote small { color: var(--muted); }

/* faq */
.faq { max-width: 780px; margin: 0 auto; display: grid; gap: 10px; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 0 22px; }
.faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 20px 0; font-weight: 600; font-size: 1.06rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 1.5rem; font-weight: 400; transition: transform .25s; color: var(--muted); }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { margin: 0 0 20px; color: var(--muted); max-width: 64ch; }

/* closing */
.closing { background: var(--accent); color: var(--accent-ink); border-radius: calc(var(--r-lg) + 8px); padding: clamp(40px, 7vw, 88px) clamp(20px, 5vw, 64px); text-align: center; position: relative; overflow: hidden; }
.closing canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; pointer-events: none; }
.closing > *:not(canvas) { position: relative; }
.closing h2 { font-size: var(--step-4); font-weight: 800; max-width: 14ch; margin: 0 auto 20px; }
.closing p { max-width: 44ch; margin: 0 auto 28px; opacity: .85; font-size: var(--step-1); }
.closing .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
.closing .btn.dark { background: var(--accent-ink); color: var(--accent); }
.mail { font-family: var(--f-mono); padding: 12px 16px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent-ink) 40%, transparent); user-select: all; overflow-wrap: anywhere; }

footer { padding-block: 40px; }
footer .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; color: var(--muted); font-size: .92rem; }
footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
footer a { text-decoration: none; }
footer a:hover { color: var(--ink); }

@keyframes rise { from { transform: translateY(18px); opacity: .001; } to { transform: none; opacity: 1; } }
@keyframes mark { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes slide { to { transform: translateX(-50%); } }
@keyframes squash { 0%,100% { transform: scale(1,1) translateY(0); } 15% { transform: scale(1.25,.75); } 45% { transform: scale(.85,1.15) translateY(-6px); } 70% { transform: scale(1.05,.95); } }
@media (max-width: 900px) {
  .navlinks { display: none; }
  .cases, .about { grid-template-columns: minmax(0, 1fr); }
  .plans { grid-template-columns: minmax(0, 1fr); }
  .portrait { aspect-ratio: 16/11; }
  .reel { aspect-ratio: 16/10; }
}
@media (max-width: 480px) {
  .stats { grid-template-columns: minmax(0, 1fr); }
  .navright .btn { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* video grid */
.videos { padding-block: 8px clamp(56px, 8vw, 104px); }
.vhead { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.vhead h2 { font-size: var(--step-3); font-weight: 800; }
.vhead .mono { color: var(--muted); }
.vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.vcard { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.vcard.feature { grid-column: 1 / -1; }
.vthumb { position: relative; aspect-ratio: 16/9; max-width: 100%; border-radius: var(--r-lg); overflow: hidden; background: var(--tile); border: 1px solid var(--line); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
.vcard:hover .vthumb:not(.playing) { transform: translateY(-4px); box-shadow: 0 30px 60px -30px color-mix(in srgb, var(--accent) 60%, transparent); }
.vthumb { display: block; width: 100%; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.vthumb.playing { cursor: default; background: #000; }
.vthumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vthumb .ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: var(--step--1); color: var(--muted); }
.vthumb .ph b { position: absolute; left: 18px; top: 16px; font-weight: 500; }
.vplay { position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; box-shadow: 0 10px 30px -10px #0008; transition: transform .25s cubic-bezier(.3,1.5,.6,1); }
.vcard:hover .vplay { transform: scale(1.1); }
.vplay::after { content: ""; border-left: 20px solid #0d0f14; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }
.vcard.feature .vplay { width: 88px; height: 88px; margin: -44px 0 0 -44px; }
.vinfo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-inline: 4px; }
.vinfo h3 { font-size: var(--step-1); font-weight: 700; letter-spacing: -.02em; min-width: 0; }
.vinfo span { color: var(--muted); font-size: .9rem; white-space: nowrap; }
.contact { text-align: center; padding: clamp(40px, 7vw, 80px) clamp(16px, 4vw, 48px); margin-bottom: clamp(48px, 7vw, 88px); background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--r-lg) + 8px); display: flex; flex-direction: column; align-items: center; gap: 28px; }
.contact h2 { font-size: var(--step-3); font-weight: 800; max-width: 16ch; position: relative; z-index: 0; }
.mailrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.mail { font-family: var(--f-mono); font-size: 1.05rem; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); text-decoration: none; user-select: all; overflow-wrap: anywhere; }
@media (max-width: 640px) { .vgrid { grid-template-columns: minmax(0, 1fr); } }
</style>
<style>html,body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="navbar">
      <a class="brand" href="#top"><b aria-hidden="true"></b>Vasu</a>
      <div class="navright">
        <button class="iconbtn" type="button" id="theme" aria-label="Switch light or dark theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <div class="hero rise">
      <span class="eyebrow"><span class="dot"></span>Animator · Kerala, India</span>
      <h1>Animated videos people <span class="serif">actually</span> <span class="hl">watch.</span></h1>
      <p>I'm Vasu, an independent animator making explainers, product launches and brand motion.</p>
      <div class="ctas">
        <a class="btn accent" href="#videos">See my videos <span class="arrow">↓</span></a>
      </div>
    </div>

    <section class="videos" id="videos">
      <div class="vhead">
        <h2>Recent <span class="serif">work</span></h2>
        <span class="mono">Click to play</span>
      </div>
      <div class="vgrid" id="vgrid"></div>
    </section>

    <section class="contact" id="contact">
      <h2>Contact for your <span class="serif">next</span> <span class="hl">launch.</span></h2>
      <div class="mailrow">
        <a class="mail" id="mail" href="mailto:explainervds@gmail.com">explainervds@gmail.com</a>
        <button class="btn accent" type="button" id="copy">Copy email</button>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap"><span>© 2026 Vasu</span></div>
</footer>

<script>
/* =========================================================
   PASTE YOUR YOUTUBE VIDEOS HERE
   Any YouTube link works: youtube.com/watch?v=..., youtu.be/..., or /shorts/...
   The first video is shown large. Add or remove lines freely.
   ========================================================= */
const VIDEOS = [
  { title: "Kitaabh",           tag: "Explainer",      url: "https://youtu.be/Sy57dUtnMTk" },
  { title: "Toggl Track",       tag: "Product explainer", url: "https://youtu.be/Ft1phhuKVII" },
  { title: "Flexa",             tag: "Brand launch",   url: "https://youtu.be/60cmC-enmak" },
  { title: "Atypica",           tag: "Product animation", url: "https://youtu.be/xwnaobdM6YA" },
  { title: "Kita · YC 26",      tag: "Concept video",  url: "https://youtu.be/A3Zh200R6T8" },
];

(() => {
  const root = document.documentElement;
  // theme toggle
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  try { const s = localStorage.getItem('theme'); if (s) root.dataset.theme = s; } catch (e) {}
  document.getElementById('theme').addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  });

  // video grid
  const ytId = u => {
    const m = String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  };
  const tiles = ['var(--tile-a)', 'var(--tile-b)', 'var(--tile-c)', 'var(--tile-d)'];
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const grid = document.getElementById('vgrid');
  VIDEOS.forEach((v, i) => {
    const id = ytId(v.url);
    const card = document.createElement('div');
    card.className = 'vcard' + (i === 0 ? ' feature' : '');
    card.innerHTML = `<button type="button" class="vthumb" style="--tile:${tiles[i % 4]}" aria-label="Play ${esc(v.title)}">
        <div class="ph"><b>${String(i + 1).padStart(2, '0')}</b>${id ? '' : 'Paste a YouTube link'}</div>
        <span class="vplay" aria-hidden="true"></span>
      </button>
      <div class="vinfo"><h3>${esc(v.title)}</h3><span>${esc(v.tag || '')}</span></div>`;
    const thumb = card.querySelector('.vthumb');
    if (id) {
      const img = new Image();
      img.alt = '';
      img.onload = () => { if (img.naturalWidth > 200) thumb.prepend(img); };
      img.src = `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
      img.onerror = () => { if (!img.dataset.retry) { img.dataset.retry = 1; img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; } };
      thumb.addEventListener('click', () => {
        // stop any other playing video
        document.querySelectorAll('.vthumb.playing').forEach(t => t.replaceWith(t._orig));
        const box = document.createElement('div');
        box.className = 'vthumb playing';
        box._orig = thumb;
        box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        thumb.replaceWith(box);
      });
    }
    grid.appendChild(card);
  });

  // copy email
  const copy = document.getElementById('copy'), mail = document.getElementById('mail');
  copy.addEventListener('click', () => {
    const done = () => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy email', 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(mail); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = 'Selected, press Ctrl+C'; };
    try { navigator.clipboard.writeText(mail.textContent).then(done, fallback); } catch (e) { fallback(); }
  });
})();
</script>

</body>
</html>
